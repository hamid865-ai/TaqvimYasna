name: Build Yasna source ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - '.github/workflows/source-zip.yml'

jobs:
  source-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create source ZIP
        run: |
          mkdir -p dist
          zip -r dist/TaqvimYasna_Source_Test.zip . -x '.git/*' 'dist/*' '__pycache__/*' '*.pyc'

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TaqvimYasna-Source-Test
          path: dist/TaqvimYasna_Source_Test.zip
          retention-days: 14
