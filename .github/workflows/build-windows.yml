name: Build Yasna for Windows 7 and later

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '.github/workflows/build-windows.yml'
      - 'installer/**'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python compatible with Windows 7
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x64'

      - name: Install pinned build dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install "PyQt5==5.15.10" "PyInstaller==5.13.2" "pywin32==306"

      - name: Verify pywin32 imports
        run: |
          python -c "import win32com.client, pythoncom, pywintypes; print('PYWIN32 IMPORTS OK')"

      - name: Build standalone application
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir
          --name Yasna
          --collect-all PyQt5
          --collect-all win32com
          --collect-all win32
          --hidden-import PyQt5.sip
          --hidden-import PyQt5.QtPrintSupport
          --hidden-import PyQt5.QtMultimedia
          --hidden-import PyQt5.QtSvg
          --hidden-import win32com
          --hidden-import win32com.client
          --hidden-import pythoncom
          --hidden-import pywintypes
          --hidden-import win32timezone
          --collect-submodules win32com
          --collect-submodules win32
          main.py

      - name: Include pywin32 runtime DLLs
        shell: pwsh
        run: |
          $pythonRoot = python -c "import sys; print(sys.prefix)"
          $dllFolder = Join-Path $pythonRoot "Lib\site-packages\pywin32_system32"
          if (-not (Test-Path $dllFolder)) {
            throw "pywin32 runtime DLL folder not found: $dllFolder"
          }
          $dlls = Get-ChildItem -Path $dllFolder -Filter "*.dll"
          if ($dlls.Count -lt 2) {
            throw "Expected pywin32 runtime DLLs were not found."
          }
          Copy-Item -Path (Join-Path $dllFolder "*.dll") -Destination "dist/Yasna" -Force
          Write-Host "Copied pywin32 runtime DLLs:"
          $dlls | ForEach-Object { Write-Host $_.Name }

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/Yasna/*" -DestinationPath "dist/Yasna_Portable_Windows.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Yasna.iss'

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Yasna-Windows-7-and-later
          path: |
            dist/Yasna_Portable_Windows.zip
            dist/Yasna_Setup.exe
          if-no-files-found: error
          retention-days: 30
