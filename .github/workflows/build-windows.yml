name: Build Yasna portable for Windows 7 and later

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '.github/workflows/build-windows.yml'
      - 'installer/**'
      - 'Icon.ico'
      - 'Dash.jpg'
      - 'Yasna.db'
      - 'assets/**'
      - 'data/**'
      - 'database/**'
      - 'forms/**'
      - 'templates/**'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python compatible with Windows 7 target
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x64'

      - name: Install pinned build dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install "PyQt5==5.15.10" "PyInstaller==5.13.2" "pywin32==306"

      - name: Verify required files
        shell: pwsh
        run: |
          $required = @("main.py", "Icon.ico", "Dash.jpg", "Yasna.db")
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required build file missing: $file" }
          }

      - name: Verify pywin32 imports
        run: python -c "import win32com.client, pythoncom, pywintypes; print('PYWIN32 IMPORTS OK')"

      - name: Build standalone application
        shell: pwsh
        run: |
          $pyinstallerArgs = @(
            "--noconfirm",
            "--clean",
            "--windowed",
            "--onedir",
            "--name", "Yasna",
            "--icon", "Icon.ico",
            "--collect-all", "PyQt5",
            "--collect-all", "win32com",
            "--collect-all", "win32",
            "--hidden-import", "PyQt5.sip",
            "--hidden-import", "PyQt5.QtPrintSupport",
            "--hidden-import", "PyQt5.QtMultimedia",
            "--hidden-import", "PyQt5.QtSvg",
            "--hidden-import", "win32com.client",
            "--hidden-import", "pythoncom",
            "--hidden-import", "pywintypes",
            "--hidden-import", "win32timezone",
            "--collect-submodules", "win32com",
            "--collect-submodules", "win32",
            "--add-data", "Icon.ico;.",
            "--add-data", "Dash.jpg;.",
            "--add-data", "Yasna.db;.",
            "--add-data", "Example.docx;.",
            "--add-data", "assets;assets",
            "main.py"
          )
          & pyinstaller @pyinstallerArgs
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with exit code $LASTEXITCODE" }

      - name: Include pywin32 runtime DLLs
        shell: pwsh
        run: |
          $pythonRoot = python -c "import sys; print(sys.prefix)"
          $dllFolder = Join-Path $pythonRoot "Lib\site-packages\pywin32_system32"
          if (-not (Test-Path $dllFolder)) {
            throw "pywin32 runtime DLL folder not found: $dllFolder"
          }
          $dlls = Get-ChildItem -Path $dllFolder -Filter "*.dll"
          if ($dlls.Count -lt 2) {
            throw "Expected pywin32 runtime DLLs were not found."
          }
          Copy-Item -Path (Join-Path $dllFolder "*.dll") -Destination "dist/Yasna" -Force

      - name: Verify executable and bundled resources
        shell: pwsh
        run: |
          $required = @(
            "dist/Yasna/Yasna.exe",
            "dist/Yasna/Icon.ico",
            "dist/Yasna/Dash.jpg",
            "dist/Yasna/Yasna.db"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Build output missing: $file" }
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Yasna/*" -DestinationPath "dist/Yasna_Portable_Windows.zip" -Force

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: Yasna-Portable-Windows-Test
          path: dist/Yasna_Portable_Windows.zip
          if-no-files-found: error
          retention-days: 30
