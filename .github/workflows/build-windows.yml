name: Build Yasna for Windows 7 and later

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '.github/workflows/build-windows.yml'
      - 'installer/**'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python compatible with Windows 7
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x64'

      - name: Install pinned build dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install "PyQt5==5.15.10" "PyInstaller==5.13.2"

      - name: Build standalone application
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir
          --name Yasna
          --collect-all PyQt5
          --hidden-import PyQt5.sip
          --hidden-import PyQt5.QtPrintSupport
          --hidden-import PyQt5.QtMultimedia
          --hidden-import PyQt5.QtSvg
          main.py

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/Yasna/*" -DestinationPath "dist/Yasna_Portable_Windows.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Yasna.iss'

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Yasna-Windows-7-and-later
          path: |
            dist/Yasna_Portable_Windows.zip
            dist/Yasna_Setup.exe
          if-no-files-found: error
          retention-days: 30
