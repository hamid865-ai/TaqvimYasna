name: Create test ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create source ZIP
        run: |
          zip -r TaqvimYasna_Test.zip . \
            -x ".git/*" \
               "*/__pycache__/*" \
               "*.pyc" \
               ".github/workflows/*"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaqvimYasna-Test-ZIP
          path: TaqvimYasna_Test.zip
          if-no-files-found: error
          retention-days: 14
